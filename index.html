<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多店即時看板</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Microsoft JhengHei",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  header h1{font-size:24px}
  .meta{font-size:14px;color:#94a3b8}
  .live-dot{display:inline-block;width:8px;height:8px;background:#10b981;border-radius:50%;margin-right:6px;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:0.3}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;max-width:1400px;margin:0 auto}
.card{background:#1e293b;border-radius:10px;padding:12px;border:2px solid transparent;font-size:13px}
  .card.online{border-color:#10b981}
  .card.offline{border-color:#ef4444}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
  .store-name{font-size:18px;font-weight:bold}
  .last-seen{font-size:12px;color:#94a3b8;margin-top:2px}
  .status{font-size:12px;padding:4px 8px;border-radius:6px;font-weight:bold}
  .status.online{background:rgba(16,185,129,0.2);color:#10b981}
  .status.offline{background:rgba(239,68,68,0.2);color:#ef4444}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:rgba(255,255,255,0.04);padding:10px;border-radius:8px;text-align:center}
  .stat-label{font-size:12px;color:#94a3b8;margin-bottom:4px}
  .stat-value{font-size:16px;font-weight:bold;color:#e2e8f0}
  .payments{margin-bottom:12px;padding:10px;background:rgba(255,255,255,0.04);border-radius:8px}
  .payments-title{font-size:13px;color:#94a3b8;margin-bottom:6px}
  .payment-row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#e2e8f0}
  .session{padding:10px;background:rgba(16,185,129,0.08);border-radius:8px}
  .session-title{display:flex;justify-content:space-between;font-size:13px;color:#94a3b8;margin-bottom:6px}
  .session-row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
  .no-session{text-align:center;color:#94a3b8;font-size:14px}
  .empty{text-align:center;padding:60px 20px;color:#94a3b8}
  .empty h2{margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div>
    <h1>📊 多店即時看板</h1>
    <div class="meta"><span class="live-dot"></span>即時連線中 · <span id="updateTime">--</span></div>
  </div>
  <div class="meta" id="storeCount">店鋪數：0</div>
</header>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none"><h2>尚無店鋪資料</h2><p>請確認 POS 端已設定 storeId 並運行</p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDbwfDz_dyjNLjqQjj5zELlmQDmKt1lJOI",
  authDomain: "webpos-1f626.firebaseapp.com",
  databaseURL: "https://webpos-1f626-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "webpos-1f626",
  storageBucket: "webpos-1f626.appspot.com",
  messagingSenderId: "445432162673",
  appId: "1:445432162673:web:abc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dashRef = ref(db, "dashboards");

const ONLINE_THRESHOLD = 90 * 1000;

const fmt = n => (Number(n)||0).toLocaleString() + " 元";
const pad = n => String(n).padStart(2,"0");
function timeAgo(iso){if(!iso) return "未知"; const diff=Date.now()-new Date(iso).getTime(); if(diff<60000) return Math.floor(diff/1000)+" 秒前"; if(diff<3600000) return Math.floor(diff/60000)+" 分鐘前"; if(diff<86400000) return Math.floor(diff/3600000)+" 小時前"; return Math.floor(diff/86400000)+" 天前";}
function fmtTime(iso){if(!iso) return "--"; const d=new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}

function render(data){
  const grid=document.getElementById("grid");
  const empty=document.getElementById("empty");
  const stores=data?Object.entries(data):[];
  document.getElementById("storeCount").textContent="店鋪數："+stores.length;
  document.getElementById("updateTime").textContent=new Date().toLocaleTimeString("zh-TW");
  if(stores.length===0){grid.innerHTML=""; empty.style.display="block"; return;}
  empty.style.display="none";
  grid.innerHTML = stores.map(([storeId,d])=>{
    const hb=d.heartbeat||{}; const today=d.today||{}; const session=d.session||null;
    const lastSeen=hb.lastSeenAt; const isOnline=lastSeen && (Date.now()-new Date(lastSeen).getTime()<ONLINE_THRESHOLD);
    const name=hb.storeName||storeId;

    const payments=today.payments||{};
    const paymentEntries=Object.entries(payments);
    const paymentHtml = paymentEntries.length>0 ? `
      <div class="payments">
        <div class="payments-title">💰 支付方式分項</div>
        ${paymentEntries.map(([pname,info])=>`
          <div class="payment-row">
            <span>${pname}</span>
            <span>${fmt(info.amount)}（${info.count} 單）</span>
          </div>
        `).join('')}
      </div>
    ` : '';

    const sessionHtml = session ? `
      <div class="session">
        <div class="session-title"><span>🟢 目前班次</span><span>${fmtTime(session.startedAt)} 開班</span></div>
        <div class="session-row"><span>值班人員</span><span>${session.staffName||session.staffId||"--"}</span></div>
        <div class="session-row"><span>開班現金</span><span>${fmt(session.openingCash)}</span></div>
        <div class="session-row"><span>目前現金</span><span>${fmt(session.currentCash)}</span></div>
      </div>
    ` : `<div class="session"><div class="no-session">⚪ 目前無人值班</div></div>`;

    return `
      <div class="card ${isOnline?"online":"offline"}">
        <div class="card-head">
          <div>
            <div class="store-name">${name}</div>
            <div class="last-seen">最後心跳：${timeAgo(lastSeen)}</div>
          </div>
          <span class="status ${isOnline?"online":"offline"}">${isOnline?"● 線上":"● 離線"}</span>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-label">今日營業額</div><div class="stat-value">${fmt(today.salesTotal)}</div></div>
          <div class="stat"><div class="stat-label">訂單數</div><div class="stat-value">${today.orderCount||0}</div></div>
          <div class="stat"><div class="stat-label">客單價</div><div class="stat-value">${fmt(today.avgTicket)}</div></div>
        </div>
        ${paymentHtml}
        ${sessionHtml}
      </div>
    `;
  }).join("");
}

onValue(dashRef, snap=>render(snap.val()), err=>{console.error("Firebase 讀取失敗",err); document.getElementById("empty").innerHTML="<h2>連線失敗</h2><p>"+err.message+"</p>"; document.getElementById("empty").style.display="block";});

setInterval(()=>{ document.getElementById("updateTime").textContent=new Date().toLocaleTimeString("zh-TW"); },1000);
</script>
</body>
</html>
