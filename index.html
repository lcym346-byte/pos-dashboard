<style>

  .status{font-size:12px;padding:4px 8px;border-radius:6px;font-weight:bold}
  .status.online{background:rgba(16,185,129,0.2);color:#10b981}
  .status.offline{background:rgba(239,68,68,0.2);color:#ef4444}
   .totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .total-cell{background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.35);padding:8px 10px;border-radius:8px;text-align:center}
  .total-label{font-size:11px;color:#94a3b8;margin-bottom:2px}
  .total-value{font-size:15px;font-weight:bold;color:#e2e8f0}
  .total-loading{color:#64748b;font-style:italic}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:rgba(255,255,255,0.04);padding:10px;border-radius:8px;text-align:center}
  .stat-label{font-size:12px;color:#94a3b8;margin-bottom:4px}
  .stat-value{font-size:16px;font-weight:bold;color:#e2e8f0}
 .stat-value.negative{color:#ef4444}
  .payments{margin-bottom:12px;padding:10px;background:rgba(255,255,255,0.04);border-radius:8px}
  .payments-title{font-size:13px;color:#94a3b8;margin-bottom:6px}
  .payment-row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#e2e8f0}
  .session{padding:10px;background:rgba(16,185,129,0.08);border-radius:8px}

  /* 頂部按鈕 */
  .btn{display:inline-flex;align-items:center;gap:6px;background:#3b82f6;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
  .btn:hover{background:#2563eb}
  .btn.secondary{background:#334155}
  .btn.secondary:hover{background:#475569}
  .btn:disabled{opacity:0.5;cursor:not-allowed}

  /* === 登入相關樣式 === */
  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-box{max-width:420px;width:100%;background:#1e293b;border-radius:16px;padding:40px 32px;text-align:center;border:1px solid #334155}
  .auth-icon{font-size:56px;margin-bottom:16px}
  .auth-title{font-size:24px;font-weight:bold;margin-bottom:8px}
  .auth-subtitle{color:#94a3b8;margin-bottom:28px;line-height:1.6}
  .google-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f2937;border:none;padding:14px 20px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s}

  .google-btn:disabled{opacity:0.6;cursor:wait}
  .google-icon{width:20px;height:20px}
  .auth-error{background:rgba(239,68,68,0.1);border:1px solid #ef4444;color:#fca5a5;border-radius:10px;padding:14px;margin-top:16px;font-size:14px;text-align:left;line-height:1.6}
  .auth-warn{background:rgba(251,191,36,0.1);border:1px solid #fbbf24;color:#fbbf24;border-radius:10px;padding:14px;margin-top:16px;font-size:14px}

  /* === 報表 Modal === */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9000;display:none;align-items:center;justify-content:center;padding:20px}

  .modal-body{padding:20px;overflow:auto;flex:1}
  .modal-foot{padding:14px 20px;border-top:1px solid #334155;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

  .form-row{margin-bottom:14px}

  .form-row input,.form-row select{width:100%;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:8px 10px;border-radius:6px;font-size:14px}

  .store-list label input{width:auto}
  .preview-frame{width:100%;height:60vh;border:1px solid #334155;border-radius:8px;background:#fff}

  

  /* 異常提示 */
  .alert-badge{display:inline-block;background:#ef4444;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:bold}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 自家模組
import {
  printReport,
  previewReport,
  buildSummaryReport,
  buildSessionReport,
  buildOrderDetailReport,
  buildAnomalyReport,
  exportCSV,
  summaryToCSV,
  sessionsToCSV,
  ordersToCSV,
  anomalyToCSV
} from './js/print-service-dashboard.js';

import {
  listStores,
  loadHistory,
  getDateRange
} from './js/history-loader.js';

const firebaseConfig = {
  apiKey: "AIzaSyBOmGn6HQI0O6RU6Iu2hh44TbFoneblbyk",
  authDomain: "webpos-1f626.firebaseapp.com",
  databaseURL: "https://webpos-1f626-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "webpos-1f626",
  storageBucket: "webpos-1f626.firebasestorage.app",
  messagingSenderId: "203764995518",
  appId: "1:203764995518:web:8ebdf39837c5c59c4995ef",
  measurementId: "G-34XEG1QCHW"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const dashRef = ref(db, "dashboards");
const ONLINE_THRESHOLD = 90 * 1000;
const ALERT_SESSION_HOURS = 14;

let dashboardListenerStarted = false;
let lastDashboardData = null;
let lastReportData = null;       // 暫存目前產生的 report 物件（給列印按鈕用）
let lastRawHistory = null;       // 暫存原始 loadHistory 結果（給 CSV 用）
let lastReportType = 'summary';

// === DOM 工具 ===
const $ = id => document.getElementById(id);
function showLogin(){ $('loginScreen').style.display='flex'; $('dashboardScreen').style.display='none'; }
function showDashboard(){ $('loginScreen').style.display='none'; $('dashboardScreen').style.display='block'; }
function showAuthError(html){
  const el = $('authError');
  el.className = 'auth-error';
  el.innerHTML = html;
  el.style.display = 'block';
}
function clearAuthError(){ $('authError').style.display='none'; }
const money = v => '$' + (Number(v) || 0).toLocaleString('zh-TW');

// === Google 登入 ===
$('googleSignInBtn').addEventListener('click', async ()=>{
  const btn = $('googleSignInBtn');
  const label = $('googleSignInLabel');
  btn.disabled = true;
  label.textContent = '登入中...';
  clearAuthError();
  try{
    await signInWithPopup(auth, provider);
  }catch(err){
    btn.disabled = false;
    label.textContent = '使用 Google 登入';
    if(err.code === 'auth/popup-closed-by-user'){
      showAuthError('🛈 您取消了登入。請再試一次。');
    } else if(err.code === 'auth/popup-blocked'){
      showAuthError('⚠️ 瀏覽器封鎖了登入彈窗，請允許彈窗後再試。');
    } else {
      showAuthError('❌ 登入失敗：<br>' + (err.message || err.code));
    }
  }
});

// === 登出 ===
$('logoutBtn').addEventListener('click', async ()=>{
  if(!confirm('確定要登出嗎？')) return;
  await signOut(auth);
});

// === 權限檢查 ===
async function checkWhitelist(uid){
  if(!uid) return false;
  try{
    const snapshot = await get(ref(db, `staff/${uid}`));
    const data = snapshot.val();
    if(!data) return false;
    const role = String(data.role || '').trim();
    return role === 'admin' || role === 'staff';
  }catch(err){
    console.error('讀取 staff 失敗：', err);
    throw err;
  }
}

// === 認證狀態 ===
onAuthStateChanged(auth, async user => {
  const btn = $('googleSignInBtn');
  const label = $('googleSignInLabel');

  if(!user){
    showLogin();
    btn.disabled = false;
    label.textContent = '使用 Google 登入';
    clearAuthError();
    return;
  }

  const displayEmail =
    user.email ||
    (user.providerData && user.providerData[0] && user.providerData[0].email) ||
    user.displayName ||
    user.uid;

  showLogin();
  btn.disabled = true;
  label.textContent = '檢查權限中...';

  try{
    const allowed = await checkWhitelist(user.uid);
    if(!allowed){
      showAuthError(`
        <strong>🚫 您沒有看板權限</strong><br><br>
        登入帳號：<code style="color:#fbbf24">${displayEmail}</code><br>
        UID：<code style="color:#94a3b8;font-size:11px">${user.uid}</code><br><br>
        此 Google 帳號不在授權清單內，<br>
        請聯絡管理員加入後再使用。
        <div style="text-align:center;margin-top:14px">
          <button id="unauthLogoutBtn" class="logout-btn">登出此帳號</button>
        </div>
      `);
      btn.style.display = 'none';
      document.getElementById('unauthLogoutBtn').onclick = async ()=>{
        await signOut(auth);
        btn.style.display = '';
      };
      return;
    }

    $('currentUserEmail').textContent = displayEmail;
    showDashboard();
    btn.disabled = false;
    label.textContent = '使用 Google 登入';
    clearAuthError();
    startDashboardListener();
  }catch(err){
    showAuthError(`
      ❌ 權限檢查失敗：<br>${err.message || err.code}<br><br>
      請確認 Firebase 規則允許讀取 <code>staff/{uid}</code>。
      <div style="text-align:center;margin-top:14px">
        <button id="errLogoutBtn" class="logout-btn">登出</button>
      </div>
    `);
    btn.style.display = 'none';
    document.getElementById('errLogoutBtn').onclick = async ()=>{
      await signOut(auth);
      btn.style.display = '';
    };
  }
});

// === 看板資料載入 ===
const fmt = n => (Number(n)||0).toLocaleString() + " 元";
const pad = n => String(n).padStart(2,"0");
function timeAgo(iso){if(!iso) return "未知"; const diff=Date.now()-new Date(iso).getTime(); if(diff<60000) return Math.floor(diff/1000)+" 秒前"; if(diff<3600000) return Math.floor(diff/60000)+" 分鐘前"; if(diff<86400000) return Math.floor(diff/3600000)+" 小時前"; return Math.floor(diff/86400000)+" 天前";}
function fmtTime(iso){if(!iso) return "--"; const d=new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}

function detectAlerts(storeId, d){
  const alerts = [];
  const hb = d.heartbeat || {};
  const session = d.session;
  const lastSeen = hb.lastSeenAt;
  if(lastSeen){
    const ageMin = (Date.now() - new Date(lastSeen).getTime()) / 60000;
    if(ageMin > 5 && ageMin < 60) alerts.push('離線 ' + Math.floor(ageMin) + ' 分');
    if(ageMin >= 60) alerts.push('離線 ' + Math.floor(ageMin/60) + ' 小時');
  }
  if(session && session.startedAt){
    const hrs = (Date.now() - new Date(session.startedAt).getTime()) / 3600000;
    if(hrs > ALERT_SESSION_HOURS) alerts.push('班次未結 ' + Math.floor(hrs) + ' 小時');
  }
  return alerts;
}


function render(data){
  lastDashboardData = data;
  const grid=$("grid");
  const empty=$("empty");
  const stores=data?Object.entries(data):[];
  $("storeCount").textContent="店鋪數："+stores.length;
  $("updateTime").textContent=new Date().toLocaleTimeString("zh-TW");
  

  if(stores.length===0){grid.innerHTML=""; empty.style.display="block"; return;}
  empty.style.display="none";
    grid.innerHTML = stores.map(([storeId,d])=>{
    const hb=d.heartbeat||{}; const today=d.today||{}; const session=d.session||null;
    const weekMonth = getStoreWeekMonth(storeId, today);
    const lastSeen=hb.lastSeenAt; const isOnline=lastSeen && (Date.now()-new Date(lastSeen).getTime()<ONLINE_THRESHOLD);
    const name=hb.storeName||storeId;
    const alerts = detectAlerts(storeId, d);
    const alertHtml = alerts.length > 0
      ? alerts.map(a => `<span class="alert-badge">⚠ ${a}</span>`).join('')
      : '';

    const payments=today.payments||{};
    const paymentEntries=Object.entries(payments);
    const paymentHtml = paymentEntries.length>0 ? `
      <div class="payments">
        <div class="payments-title">💰 支付方式分項</div>
        ${paymentEntries.map(([pname,info])=>`
          <div class="payment-row">

            <span>${fmt(info.amount)}（${info.count} 單）</span>

        `).join('')}

    ` : '';

    const sessionHtml = session ? `
      <div class="session">
        <div class="session-title"><span>🟢 目前班次</span><span>${fmtTime(session.startedAt)} 開班</span></div>
        <div class="session-row"><span>值班人員</span><span>${session.staffName||session.staffId||"--"}</span></div>
        <div class="session-row"><span>開班現金</span><span>${fmt(session.openingCash)}</span></div>
        <div class="session-row"><span>目前現金</span><span>${fmt(session.currentCash)}</span></div>
      </div>
    ` : `<div class="session"><div class="no-session">⚪ 目前無人值班</div></div>`;

    return `
      <div class="card ${isOnline?"online":"offline"}">
        <div class="card-head">
          <div>
            <div class="store-name">${name}${alertHtml}</div>
            <div class="last-seen">最後更新：${timeAgo(lastSeen)}</div>
          </div>
          <span class="status ${isOnline?"online":"offline"}">${isOnline?"● 線上":"● 離線"}</span>
        </div>
                <div class="totals">
          <div class="total-cell"><div class="total-label">本週累計</div><div class="total-value ${weekMonth.loading?'total-loading':''}" data-store="${storeId}" data-period="week">${weekMonth.loading?'載入中...':fmt(weekMonth.week)}</div></div>
          <div class="total-cell"><div class="total-label">本月累計</div><div class="total-value ${weekMonth.loading?'total-loading':''}" data-store="${storeId}" data-period="month">${weekMonth.loading?'載入中...':fmt(weekMonth.month)}</div></div>
        </div>
                <div class="stats">
          <div class="stat"><div class="stat-label">營業額</div><div class="stat-value">${fmt(today.salesTotal)}</div></div>
          <div class="stat"><div class="stat-label">訂單數</div><div class="stat-value">${today.orderCount||0}</div></div>
          <div class="stat"><div class="stat-label">客單價</div><div class="stat-value">${fmt(today.avgTicket)}</div></div>
        </div>
                ${(() => {
          // v20260613：異常單（void/cancelled/refunded）已從 salesTotal 排除
          //            外送金額已計入 salesTotal（屬「其他」付款），這裡單獨顯示讓店長能拆解
          const voided = today.voided || { amount: 0, count: 0 };
          const voidedAmt = Number(voided.amount || 0);
          const voidedCount = Number(voided.count || 0);
          const delivery = today.delivery || { total: 0, panda: 0, uber: 0 };
          const deliveryTotal = Number(delivery.total || 0);
          return `
        <div class="stats">
          <div class="stat"><div class="stat-label">異常單金額</div><div class="stat-value ${voidedAmt > 0 ? 'negative' : ''}">${voidedAmt > 0 ? '-' + fmt(voidedAmt) : fmt(0)}</div></div>
          <div class="stat"><div class="stat-label">異常單數</div><div class="stat-value ${voidedCount > 0 ? 'negative' : ''}">${voidedCount} 單</div></div>
          <div class="stat"><div class="stat-label">🛵 外送</div><div class="stat-value" style="color:#60a5fa">${fmt(deliveryTotal)}</div></div>
        </div>
          `;
        })()}


        ${paymentHtml}
        ${sessionHtml}

      </div>
    `;
  }).join("");
}
// ============================================================
// 本週 / 本月 累計（從 sessionHistory 撈，60 秒快取一次）
// ============================================================
import { ref as fbRef, get as fbGet } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const weekMonthCache = {
  // storeId -> { weekHistorical, monthHistorical, fetchedAt }
};
let weekMonthLoading = false;
const WEEK_MONTH_TTL_MS = 60 * 1000;  // 60 秒重撈

function pad2(n){ return String(n).padStart(2,'0'); }
function dateStr(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }

// 取得本週週一（以週一為一週起點）
function getWeekStart(){
  const d = new Date();
  d.setHours(0,0,0,0);
  const day = d.getDay();              // 週日=0, 週一=1, ..., 週六=6
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}

// 取得本月 1 號
function getMonthStart(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), 1);
}

// 列出 [from, to] 之間（含端點）所有日期字串
function datesBetween(from, to){
  const out = [];
  const cur = new Date(from);
  while(cur <= to){
    out.push(dateStr(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

// 從 sessionHistory 撈某一天的營業額（多個 session 加總，排除作廢）
function sumDayFromSessions(dayObj){
  if(!dayObj) return 0;
  let total = 0;
  Object.values(dayObj).forEach(session => {
    if(!session || !Array.isArray(session.orders)) return;
    session.orders.forEach(o => {
      const status = String(o.status || '').toLowerCase();
      if(['void','cancelled','refunded'].includes(status)) return;
      total += Number(o.total || 0);
    });
  });
  return total;
}

// 載入本週 + 本月歷史（不含今日；今日從 dashboards.today 即時加）
async function loadWeekMonthHistorical(storeIds){
  if(weekMonthLoading) return;
  weekMonthLoading = true;
  try {
    const todayDate = new Date(); todayDate.setHours(0,0,0,0);
    const yesterday = new Date(todayDate); yesterday.setDate(yesterday.getDate() - 1);
    const weekStart = getWeekStart();
    const monthStart = getMonthStart();

    // 撈「月初 ~ 昨天」所有日期（涵蓋本週與本月歷史）
    if(yesterday < monthStart){
      // 今天就是月初，沒有歷史可撈
      storeIds.forEach(sid => {
        weekMonthCache[sid] = { weekHistorical: 0, monthHistorical: 0, fetchedAt: Date.now() };
      });
      return;
    }
    const allDates = datesBetween(monthStart, yesterday);

    for(const sid of storeIds){
      let weekHist = 0;
      let monthHist = 0;
      // 並行讀，限制併發
      const concurrency = 8;
      for(let i = 0; i < allDates.length; i += concurrency){
        const chunk = allDates.slice(i, i + concurrency);
        const snaps = await Promise.all(
          chunk.map(d => fbGet(fbRef(db, `sessionHistory/${sid}/${d}`)).catch(() => null))
        );
        snaps.forEach((snap, idx) => {
          if(!snap) return;
          const dayObj = snap.val();
          const daySum = sumDayFromSessions(dayObj);
          const dStr = chunk[idx];
          monthHist += daySum;
          if(dStr >= dateStr(weekStart)){
            weekHist += daySum;
          }
        });
      }
      weekMonthCache[sid] = {
        weekHistorical: weekHist,
        monthHistorical: monthHist,
        fetchedAt: Date.now()
      };
    }
  } catch(err){
    console.warn('[week-month] 載入失敗', err);
  } finally {
    weekMonthLoading = false;
    // 載入完成 → 重繪一次最新的 dashboard 資料
    if(lastDashboardData) render(lastDashboardData);
  }
}
// ============================================================
// v20260613：取得「主店」營業時段（用於跨店 BD 計算）
// 邏輯：若所有店 businessHours 相同 → 直接用；否則用第一個店的
// 結果快取在 cachedMainBusinessHours，由 startDashboardListener() 第一次拿到資料時填入
// ============================================================
let cachedMainBusinessHours = null;

// v20260516a：判斷 businessHours 是否為有效結構（新版七天 slot 或舊版扁平）
function _isValidBH(bh){
  if(!bh || typeof bh !== 'object') return false;
  const KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
  // 新版：任一 weekday 為陣列即視為有效
  if(KEYS.some(k => Array.isArray(bh[k]))) return true;
  // 舊版：扁平 {openTime, closeTime}
  if(bh.openTime && bh.closeTime) return true;
  return false;
}

// v20260516a：把扁平 {openTime,closeTime} 轉成新版七天 slot 結構
function _normalizeBH(bh){
  if(!bh || typeof bh !== 'object') return null;
  const KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
  if(KEYS.some(k => Array.isArray(bh[k]))) return bh; // 已是新版
  if(bh.openTime && bh.closeTime){
    const slot = [{ start: bh.openTime, end: bh.closeTime }];
    const out = {};
    KEYS.forEach(k => { out[k] = slot; });
    return out;
  }
  return null;
}

function getMainBusinessHours(){
  if(cachedMainBusinessHours) return cachedMainBusinessHours;
  // fallback：14:00 - 03:00，七天都營業
  const slot = [{ start: '14:00', end: '03:00' }];
  return {
    sun: slot, mon: slot, tue: slot, wed: slot,
    thu: slot, fri: slot, sat: slot
  };
}

async function refreshMainBusinessHours(){
  if(!lastDashboardData) return;
  const storeIds = Object.keys(lastDashboardData);
  // 1. 先從 lastDashboardData 找有設定 businessHours 的店
  for(const sid of storeIds){
    const bh = lastDashboardData[sid]?.businessHours;
    if(_isValidBH(bh)){
      cachedMainBusinessHours = _normalizeBH(bh);
      return;
    }
  }
  // 2. lastDashboardData 沒帶 businessHours → 直接讀 dashboards/{storeId}/businessHours
  for(const sid of storeIds){
    try{
      const snap = await fbGet(fbRef(db, `dashboards/${sid}/businessHours`));
      const v = snap.val();
      if(_isValidBH(v)){
        cachedMainBusinessHours = _normalizeBH(v);
        return;
      }
    }catch(_){}
  }
}


// 給 render 用：取得單店的週/月累計（含今日）
function getStoreWeekMonth(storeId, todayObj){
  const cache = weekMonthCache[storeId];
  const todaySales = Number((todayObj && todayObj.salesTotal) || 0);
  if(!cache){
    return { loading: true, week: 0, month: 0 };
  }
  return {
    loading: false,
    week: cache.weekHistorical + todaySales,
    month: cache.monthHistorical + todaySales
  };
}

// 每 60 秒重撈一次歷史（同時也在第一次 render 時觸發）
let weekMonthTimer = null;
function startWeekMonthLoader(){
  if(weekMonthTimer) return;
  const tick = ()=>{
    if(!lastDashboardData) return;
    const storeIds = Object.keys(lastDashboardData);
    if(storeIds.length === 0) return;
    // 檢查是否有任何快取過期
    const now = Date.now();
    const needRefresh = storeIds.some(sid => {
      const c = weekMonthCache[sid];
      return !c || (now - c.fetchedAt > WEEK_MONTH_TTL_MS);
    });
    if(needRefresh) loadWeekMonthHistorical(storeIds);
  };
  tick();  // 立即跑一次
  weekMonthTimer = setInterval(tick, 30 * 1000);  // 每 30 秒檢查一次（實際更新由 TTL 60s 控制）
}

function startDashboardListener(){
  if(dashboardListenerStarted) return;
  dashboardListenerStarted = true;
    onValue(dashRef, snap=>{
    render(snap.val());
    startWeekMonthLoader();  // 第一次拿到資料就啟動週月載入器
    refreshMainBusinessHours();  // v20260613：同步取得主店營業時段供 BD 計算用
  }, err=>{

    console.error("Firebase 讀取失敗",err);
    const empty=$("empty");
    empty.innerHTML="<h2>連線失敗</h2><p>"+err.message+"</p>";
    empty.style.display="block";
  });
  setInterval(()=>{ $("updateTime").textContent=new Date().toLocaleTimeString("zh-TW"); },1000);
}

// 載入店鋪 checkbox 清單
async function loadStoreCheckList(){
  const body = $('storeChkBody');
  body.innerHTML = '<div style="color:#94a3b8;font-size:13px">載入中...</div>';
  try {
    const stores = await listStores(db);
    if(stores.length === 0){
      body.innerHTML = '<div style="color:#fbbf24;font-size:13px">尚未偵測到任何店鋪</div>';
      return;
    }
    body.innerHTML = stores.map(s => `
      <label><input type="checkbox" class="store-chk" value="${s.storeId}" checked> ${s.storeName}（${s.storeId}）</label>
    `).join('');
    // 全選/取消全選
    $('storeAllChk').onchange = (e) => {
      const checked = e.target.checked;
      body.querySelectorAll('.store-chk').forEach(c => c.checked = checked);
    };
  } catch(err){
    body.innerHTML = '<div style="color:#ef4444;font-size:13px">載入店鋪失敗：' + (err.message || err.code) + '</div>';
  }
}

// 產生報表
$('generateReportBtn').addEventListener('click', async ()=>{
  const dateFrom = $('dateFrom').value;
  const dateTo = $('dateTo').value;
  const reportType = $('reportType').value;
  if(!dateFrom || !dateTo){
    alert('請選擇日期');
    return;
  }
  if(dateFrom > dateTo){
    alert('起始日期不能晚於結束日期');
    return;
  }
    // 檢查 60 個營業日上限（v20260613：BD 概念下用字串比較較直觀，60 天約等於 60 BD）
  const dayMs = 86400000;
  const span = (new Date(dateTo + 'T00:00:00') - new Date(dateFrom + 'T00:00:00')) / dayMs;
  if(span > 60){
    alert('區間最多 60 個營業日');
    return;
  }


  const selectedStores = Array.from(document.querySelectorAll('.store-chk:checked')).map(c => c.value);
  if(selectedStores.length === 0){
    alert('請至少選擇一家店鋪');
    return;
  }

  const btn = $('generateReportBtn');
  btn.disabled = true;
  btn.textContent = '撈取中...';

  try {
    const history = await loadHistory(db, selectedStores, dateFrom, dateTo);
    lastRawHistory = history;
    lastReportType = reportType;

    let report;
    switch(reportType){
      case 'summary':
        report = buildSummaryReport(history);
        break;
      case 'session':
        report = buildSessionReport(history);
        break;
      case 'order':
        report = buildOrderDetailReport({
          date: history.dateFrom + ' ~ ' + history.dateTo,
          stores: history.stores
        });
        break;
      case 'anomaly':
        report = buildAnomalyReport(history);
        break;
    }
    lastReportData = report;

    const paperWidth = Number($('paperWidth').value || 58);
    const html = previewReport(report, paperWidth);
    const frame = $('reportPreviewFrame');
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    $('reportPreviewTitle').textContent = '📑 ' + report.title + ' — ' + (report.subtitle || '');

    hideModal('reportModal');
    showModal('reportPreviewModal');
  } catch(err){
    console.error('產生報表失敗', err);
    alert('產生報表失敗：' + (err.message || err.code));
  } finally {
    btn.disabled = false;
    btn.textContent = '產生報表 →';
  }
});
